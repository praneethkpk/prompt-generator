spring:
  application:
    name: promptgen-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/promptgen
    username: ${DB_USERNAME:promptgen}
    password: ${DB_PASSWORD:promptgen_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cw==}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.promptgen: DEBUG
    org.springframework.security: INFO
