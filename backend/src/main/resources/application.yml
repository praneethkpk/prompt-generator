spring:
  application:
    name: promptgen-backend

  # H2 Database Configuration (for development)
  datasource:
    url: jdbc:h2:file:./data/promptgen_dev;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 Console (dev only — disabled in prod profile)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true

  # SQL initialization
  sql:
    init:
      mode: never

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:DevOnlySecretKeyThatMustBeReplacedInProduction2026!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY:900000}       # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days

  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}  # 32-byte base64 dev placeholder

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Server Configuration
server:
  port: ${PORT:8080}
