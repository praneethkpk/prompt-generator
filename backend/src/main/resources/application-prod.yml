spring:
  application:
    name: promptgen-backend

  # PostgreSQL Configuration (for production)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:promptgen_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # Disable H2 console in production
  h2:
    console:
      enabled: false

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY:604800000}

  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}

  cors:
    allowed-origins: ${CORS_ORIGINS}

# Swagger/OpenAPI — disabled in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Server Configuration
server:
  port: ${PORT:8080}
