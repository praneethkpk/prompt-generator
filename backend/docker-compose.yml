version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: promptgen-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptgen
      POSTGRES_USER: promptgen
      POSTGRES_PASSWORD: promptgen_dev
    ports:
      - "5432:5432"
    volumes:
      - promptgen_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptgen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  promptgen_data:
